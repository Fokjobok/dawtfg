map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    client_max_body_size 10m;

    # The front controller handles API errors; they must not become SPA pages.
    # Authentication and CSRF requests also belong to Laravel.
    location ~ ^/(api(?:/|$)|sanctum/csrf-cookie$|login$|logout$|register$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass backend:9000;
    }

    # Vite uses its prebundled directory and the client env module in pnpm's store.
    # Other hidden paths (including .env and .git) remain forbidden.
    location ~ ^/(?!node_modules/(?:\.vite/|\.pnpm/vite@[^/]+/node_modules/vite/dist/client/env\.mjs$))(?:[^/]+/)*\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
